name: "Deploy GTE Documentation & Wiki"

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  deploy-docs:
    name: "Fast MkDocs Build & Deploy (15s)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Documentation Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Documentation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "[Gate 0] AI & OpenCC Multi-Language Documentation Translation"
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python scripts/opencode_translate.py --docs-dir docs

      - name: "[Gate 1] Documentation Cleanliness & Symmetry Audit (0.5s)"
        run: python scripts/audit_docs.py

      - name: "[Gate 2] Build MkDocs Site with Strict 404 Checks"
        run: mkdocs build --strict -d site

      - name: Deploy to GitHub Pages (gh-pages)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: false
          cname: ''